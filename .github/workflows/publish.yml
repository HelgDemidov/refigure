name: Publish

# Separate file from ci.yml, deliberately — this workflow's job carries
# `id-token: write` (required for PyPI trusted publishing / OIDC). Keeping
# it in its own file, triggered ONLY by a version-tag push, minimizes the
# blast radius of that permission instead of granting it to the whole
# multi-job ci.yml, which runs on every push/PR.
#
# Trigger is `push: tags: v*`, not `release:` — a git tag is simpler to
# create/push (scripts/release.sh prints the exact command, never runs it
# itself) and doesn't require a separate "create a GitHub Release" step
# before publishing. A GitHub Release IS created, but only AFTER a
# successful publish (github-release job below), never as a precondition.
on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Build and publish to PyPI (trusted publishing)
    runs-on: ubuntu-latest
    # No stored token/password anywhere in this job — PyPI trusted
    # publishing (OIDC) exchanges `id-token: write`'s short-lived GitHub
    # identity token for a PyPI upload credential at publish time. Kept to
    # exactly the two permissions this job needs: `id-token: write` for
    # OIDC, `contents: read` for actions/checkout — nothing broader.
    permissions:
      id-token: write
      contents: read
    # Must match the trusted-publisher config registered on PyPI's side
    # (pypi.org -> refigure -> Publishing -> GitHub Actions), which pins
    # owner/repo/workflow-filename/environment together — see §4 of the
    # release-gate spec for the exact PyPI-side steps (manual, not
    # automated by this repo).
    environment: pypi
    steps:
      - uses: actions/checkout@v7

      - name: Install uv and set Python version
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"

      - name: Create venv and install build
        run: |
          uv venv
          uv pip install build
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Build sdist + wheel
        run: python -m build

      # Pinned by commit SHA, not tag — same discipline as ci.yml's
      # trivy-action pin (that action was supply-chain-compromised
      # 2026-03-19/20, all tags affected). This
      # job holds `id-token: write`, a materially more sensitive
      # permission than trivy-action's read-only secret scan, so pinning
      # by SHA here is the higher-stakes case, not a lower one. SHA is
      # v1.14.2's tag dereferenced to its commit (`git ls-remote --tags`
      # + `gh api repos/pypa/gh-action-pypi-publish/git/tags/<tag-sha>`),
      # the current stable release, verified live 2026-08-07 before
      # pinning.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2

  # Separate job, not a step tacked onto `publish` above — same isolation
  # principle: `needs: publish` means this never runs for a failed/aborted
  # PyPI publish, and it never needs `id-token: write`. GHCR auth is the
  # ambient `GITHUB_TOKEN` with `packages: write` — no stored secret,
  # same "nothing long-lived to leak" property `publish` gets from OIDC,
  # via a different mechanism (GHCR has no PyPI-style trusted-publishing
  # flow; this is the closest equivalent GitHub Actions offers it).
  #
  # GHCR, not Docker Hub (docs/distribution/docker-image spec §4) — path
  # is lowercase (`helgdemidov`, not `HelgDemidov`): Docker registry
  # naming requires it regardless of the actual GitHub login's case.
  # Actions pinned by commit SHA, not tag — same discipline already
  # applied to trivy-action/gh-action-pypi-publish (both have real
  # supply-chain-compromise precedent in this project's own history);
  # resolved+verified live 2026-08-21 via `git ls-remote --tags` + the
  # GitHub API (same method the pypi-publish pin above used).
  # linux/arm64 added 2026-08-22 (docs/distribution/docker-arm64 spec) —
  # each platform is built+pushed BY DIGEST on its own native runner (no
  # QEMU, same reasoning as ci.yml's docker-build matrix), then
  # docker-publish-merge below combines both digests into one multi-arch
  # manifest under the real X.Y.Z/latest tags via `docker buildx imagetools
  # create`. Digests cross the job boundary via upload/download-artifact —
  # matrix-job outputs don't reliably aggregate into a downstream job's
  # `needs.*.outputs`, this is the documented docker/build-push-action
  # pattern for exactly this case.
  docker-publish:
    name: Build and push Docker image by digest (${{ matrix.platform }})
    needs: publish
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest (no final tag yet — the merge job
          below applies the real X.Y.Z/latest tags to the combined manifest)
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # Provenance attestation is already on by default at this pinned
          # version — SBOM is NOT, and needs this explicit opt-in (verified
          # against the real action.yml at this exact commit SHA). Matches
          # the rest of this repo's security posture (Trivy/CodeQL/ruff-S/
          # pip-audit already run elsewhere) — an inconsistency to close,
          # not new tooling.
          sbom: true
          outputs: type=image,name=ghcr.io/helgdemidov/refigure,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest for the merge job
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.platform == 'linux/arm64' && 'arm64' || 'amd64' }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-publish-merge:
    name: Merge amd64+arm64 digests into one multi-arch manifest (GHCR)
    needs: docker-publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Strip the leading "v" from the tag (image tags are X.Y.Z, not vX.Y.Z)
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push the multi-arch manifest (X.Y.Z + latest)
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t ghcr.io/helgdemidov/refigure:${{ steps.version.outputs.version }} \
            -t ghcr.io/helgdemidov/refigure:latest \
            $(printf 'ghcr.io/helgdemidov/refigure@sha256:%s ' *)

      - name: Verify the published manifest lists both platforms
        run: docker buildx imagetools inspect ghcr.io/helgdemidov/refigure:${{ steps.version.outputs.version }}

  # Independent cross-platform install verification (2026-08-22,
  # docs/distribution/ecosystem-memo + a live-researched brainstorm) — tests
  # the REAL published PyPI artifact (needs: publish, not local source) on
  # the 2 platforms nothing else in this repo's CI touches: Windows and
  # macOS. Docker-on-Windows/Docker-on-macOS are deliberately NOT covered
  # here — live-verified structurally impossible on GitHub-hosted runners
  # (neither Windows nor macOS runners support nested virtualization, which
  # a Linux container needs on either host OS; macOS's default Apple
  # Silicon runners additionally lack the hardware support entirely). The
  # container's own correctness is already exhaustively covered by
  # docker-build/docker-publish's amd64+arm64 Linux legs — what's
  # untestable here is specifically "does `docker pull`/`docker run` behave
  # from a real Windows/macOS host's own Docker Desktop", a narrow,
  # low-risk gap left to an occasional manual spot-check, not CI.
  # `.mcpb`/Claude Desktop is similarly NOT covered — installing the
  # bundle is a GUI click inside Claude Desktop with no documented
  # scriptable path, disproportionate to automate; covered by a manual
  # checklist on real hardware instead (macOS: done, real M2 MacBook,
  # 2026-08-22).
  # `shell: bash` explicit on every step — Windows runners default to
  # PowerShell, macOS/Linux default to bash; declaring bash everywhere
  # keeps one script portable across both matrix legs (Windows runners
  # ship Git Bash for exactly this). NOT added to `required_status_checks`
  # — it only runs on a tag push, never on a PR, so it's structurally not
  # a PR-gating check (unlike docker-build's matrix rename gotcha, this
  # job never existed as a single un-suffixed name to begin with).
  cross-platform-verify:
    name: Cross-platform install verification (${{ matrix.os }})
    needs: publish
    runs-on: ${{ matrix.os }}
    # Read-only: this job only checks out the repo (for
    # scripts/docker_smoke_fixture.py) and installs the already-published
    # PyPI package — no gh release/Docker/registry writes, unlike every
    # other job in this file. Missing explicit permissions here was a real
    # gap (CodeQL actions/missing-workflow-permissions, alert #6) — every
    # other job already declares its own minimal set, this one was just
    # added without one.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv and set Python version
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"

      - name: Strip the leading "v" from the tag (PyPI version is X.Y.Z, not vX.Y.Z)
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # `needs: publish` only guarantees the upload API call succeeded —
      # NOT that PyPI's simple index (what `uv`/`pip` actually resolve
      # against) has propagated it yet. Hit real on v0.3.5's release: both
      # matrix legs raced the index and failed with "no version of
      # refigure==X.Y.Z" seconds after a genuinely successful publish.
      # Polls the exact endpoint the install step below resolves against
      # (not the JSON API, which can propagate on a different schedule),
      # separately from the install itself — so a real resolver failure
      # (bad dependency pin, etc.) still fails fast and distinctly, not
      # disguised as "still propagating".
      - name: Wait for PyPI's simple index to actually serve this version
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          for i in $(seq 1 30); do
            if curl -fsS "https://pypi.org/simple/refigure/" | grep -q "refigure-${version}-"; then
              echo "refigure ${version} is live on PyPI's simple index"
              exit 0
            fi
            echo "refigure ${version} not yet visible (attempt $i/30) — retrying in 10s"
            sleep 10
          done
          echo "::error::refigure ${version} never appeared on PyPI's simple index after 5 minutes"
          exit 1

      - name: Create venv, install the real published PyPI package (not
          local source), put its bin dir on PATH for later steps
        # Same uv venv + $GITHUB_PATH pattern the `publish` job above
        # already uses — that job only ever ran on ubuntu-latest, so it
        # never needed the Windows branch: a venv's executables live in
        # `.venv/Scripts` there, not `.venv/bin`. $RUNNER_OS is a GitHub
        # Actions builtin (Linux/Windows/macOS), no extra setup needed.
        shell: bash
        run: |
          uv venv
          uv pip install "refigure[full]==${{ steps.version.outputs.version }}"
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "$PWD/.venv/Scripts" >> "$GITHUB_PATH"
          else
            echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          fi

      - name: Smoke test — both console scripts
        shell: bash
        run: |
          refigure --version
          refigure-mcp --version

      - name: Smoke test — real conversion, no soffice installed (the common
          case for a fresh install — the vlm path's own soffice-missing
          degrade is already covered on Linux, not re-tested here)
        shell: bash
        run: |
          python scripts/docker_smoke_fixture.py test.docx "hello from cross-platform-verify"
          out="$(refigure test.docx)"
          echo "$out"
          echo "$out" | grep -q "hello from cross-platform-verify"

  # server.json (MCP Registry listing) was previously published via a manual,
  # interactive `mcp-publisher login github` (GitHub OAuth device flow) —
  # a real gap: nothing re-published it on any later release, so the
  # registry's version field could silently go stale. `login github-oidc`
  # (verified live 2026-08-22 against the real mcp-publisher binary's own
  # --help output, not just docs) is the same trusted-publishing shape the
  # `publish` job above already uses for PyPI — id-token: write, zero stored
  # secrets. `needs: publish` (not docker-publish) — this target is
  # independent of the Docker image, only of the PyPI release actually
  # having gone out. release.sh already keeps server.json's version in sync
  # with pyproject.toml's in the same commit, so there is nothing to bump
  # here — just publish what's already correct in the tagged commit.
  mcp-registry-publish:
    name: Publish to the official MCP Registry
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      # Pinned to a specific release + checksum-verified, not
      # /latest/download/ — same discipline as every other third-party
      # binary/action pinned in this repo. Checksum from the release's own
      # registry_1.8.1_checksums.txt, verified live 2026-08-22 (also covers
      # the mcp-publisher assets, not just the registry ones its filename
      # suggests). Bump both the URL and the checksum together on update —
      # dependabot does not track this, it's a raw release download, not a
      # GitHub Action or a package-manager dependency.
      - name: Download mcp-publisher (v1.8.1, checksum-verified)
        run: |
          curl -sL -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz"
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher

      - name: Log in via GitHub Actions OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json
        run: ./mcp-publisher publish

  # Separate job, not a step tacked onto `publish` above — deliberately, so
  # this never needs to share that job's `id-token: write`. Runs only after
  # a REAL successful publish (`needs: publish`), so a failed/aborted
  # publish attempt never gets a Release page. `gh` is the CLI pre-installed
  # on GitHub-hosted runners, not a third-party Action — no supply-chain
  # pin needed the way trivy-action/gh-action-pypi-publish above require.
  #
  # `--generate-notes` diffs against the previous tag for a real commit/PR
  # list — genuinely useful from v0.2.0 onward. v0.1.0 itself was created
  # manually with hand-curated notes (2026-08-19): the very first tag has
  # no previous release to diff against, so auto-notes would have dumped
  # the entire pre-release commit history (dependabot bumps, docs syncs,
  # etc.) instead of a meaningful "what's in this release" summary.
  github-release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Create GitHub Release with auto-generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --generate-notes

  # `needs: github-release`, not `needs: publish` — an asset can only be
  # attached to a Release that already exists. Re-uploads on EVERY
  # release, not a one-time action: the fixed filename (no version in
  # it) is what lets README's stable
  # .../releases/latest/download/refigure.mcpb link keep working —
  # GitHub's "latest" redirect resolves to whichever release is
  # currently marked latest, so the asset has to actually be attached
  # there each time, not just once on an old release (docs/distribution/
  # mcpb-bundle spec §3). Cheap either way: packing is near-instant, no
  # Docker-style build. The bundle's own dependency range
  # (mcpb/pyproject.toml) is unpinned, so re-packing on every release
  # produces byte-identical content unless the manifest/shim itself
  # changed — this job runs anyway, for the re-upload, not because the
  # artifact needs rebuilding.
  mcpb-publish:
    name: Attach refigure.mcpb to the GitHub Release
    needs: github-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Install mcpb CLI (pinned)
        run: npm install -g @anthropic-ai/mcpb@2.1.2

      - name: Pack the bundle
        run: mcpb pack mcpb/ refigure.mcpb

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" refigure.mcpb --clobber
