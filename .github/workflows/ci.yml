name: CI

# 3 independent parallel jobs (single-responsibility, clear failure
# attribution) — same shape as the source pipeline's own ci.yml, the closest
# analog to this repo's scale (single Python package, no DB/frontend).
# No branch filters, deliberately — an enumerated branch-prefix list (feat/**,
# fix/**, ...) silently skips anything outside it (ci/**, test/**, chore/**,
# a stacked PR whose base isn't main — this is exactly how PR #4 merged with
# zero live CI signal, see feedback_ci_branch_triggers memory). pull_request
# with no `branches:` filter already covers every base branch, including
# stacked-PR bases; push with no filter covers pre-PR pushes on any branch
# name. The redundant double-run (push + pull_request firing on the same
# commit once a PR is open) costs a few extra CI minutes, free on a public
# repo — a fair trade against silently skipping a branch again.
on:
  push:
  pull_request:

# Least-privilege default for every job below (CodeQL actions/
# missing-workflow-permissions, 5 alerts flagged 2026-08-19 across all 5
# jobs that had no explicit block — checkout is all any of them need).
# Job-level `permissions:` overrides this entirely, not additively, so the
# `coverage` job's own `contents: write` block (needed for the badge-commit
# push) still applies there unchanged.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Static analysis: lint, types, dependency CVE audit. Doesn't run pytest —
  # the fastest, cheapest job.
  # ---------------------------------------------------------------------------
  quality:
    name: Code quality (ruff + mypy + pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv and set Python version
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"

      - name: Create venv and install dependencies
        run: |
          uv venv
          uv pip install -r requirements-dev.txt
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Ruff (lint)
        run: ruff check refigure tests

      - name: Ruff (format check)
        run: ruff format --check refigure tests

      - name: Mypy (strict)
        run: python -m mypy refigure

      - name: Audit Python dependencies
        run: |
          uv pip install pip-audit
          pip-audit -r requirements.txt -r requirements-dev.txt

      # Narrow role: secret-scanning only, not a second SCA (pip-audit
      # above already covers CVEs). Pinned by commit SHA, not tag — the
      # action itself was supply-chain-compromised 2026-03-19/20 (credential
      # theft from the runner, all tags 0.0.1-0.34.2). SHA is v0.36.0's
      # dereferenced commit (git ls-remote --tags), the current stable
      # release, verified live before pinning.
      - name: Trivy secret scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          scanners: secret
          exit-code: "1"

  # ---------------------------------------------------------------------------
  # Build verification — always-on, cheap, catches exactly the class of bug
  # found live once before (sdist accidentally bundling
  # tests/integration/fixtures/'s 144MB corpus):
  # build sdist + wheel, enforce a size ceiling on the sdist, validate
  # metadata with twine, then install the built WHEEL into a fresh venv and
  # run `refigure --version` as a smoke test — proves the package works from
  # the built artifact itself, not an editable/source install, which no
  # other job here checks. NOT the publish workflow (that's publish.yml,
  # tag-triggered only) — this job never uploads anything anywhere.
  # ---------------------------------------------------------------------------
  build-verify:
    name: Build verification (sdist + wheel smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv and set Python version
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"

      - name: Create venv and install build + twine
        run: |
          uv venv
          uv pip install build twine
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Build sdist + wheel
        run: python -m build

      - name: Enforce sdist size ceiling
        # Current sdist is ~136KB (post-§1 fix). 5MB is a deliberately
        # generous ceiling, not a tight one — 3 orders of magnitude above
        # the real size — so ordinary growth (more tests, more refigure/
        # source) never needs retuning this number, while a regression like
        # §1's bug (sdist loses its include/exclude scope in pyproject.toml
        # and picks up the 144MB fixture corpus again) still blows straight
        # through it and fails loudly here instead of silently ballooning
        # unnoticed until someone inspects a PyPI upload.
        run: |
          size=$(stat -c '%s' dist/*.tar.gz)
          limit=$((5 * 1024 * 1024))
          echo "sdist size: $size bytes (limit: $limit bytes)"
          if [ "$size" -ge "$limit" ]; then
            echo "::error::sdist is $size bytes, over the $limit-byte ceiling — check [tool.hatch.build.targets.sdist] include/exclude in pyproject.toml"
            exit 1
          fi

      - name: Twine check (validates metadata on both built artifacts)
        run: twine check dist/*

      - name: Install the built wheel into a fresh, isolated venv
        # Deliberately a SEPARATE venv from the one used to build above —
        # proves the wheel installs and works standalone, not that it
        # merely coexists with build's own already-installed deps.
        run: |
          uv venv .venv-installcheck
          uv pip install --python .venv-installcheck/bin/python dist/*.whl

      - name: Smoke test — refigure --version from the installed wheel
        # Checks the PRINTED STRING, not just exit code — a bare `refigure
        # --version` with no assertion would happily pass even if
        # __version__ drifted out of sync with pyproject.toml (a real
        # regression this project shipped once: __init__.py hardcoded
        # "0.0.0" independent of pyproject.toml's version field, so a
        # version bump silently didn't propagate; exit-code-only checks
        # here and in the local dev loop both missed it).
        run: |
          actual="$(.venv-installcheck/bin/refigure --version)"
          expected="refigure $(grep -E '^version = ' pyproject.toml | sed -E 's/^version = "([^"]*)"$/\1/')"
          echo "actual:   $actual"
          echo "expected: $expected"
          if [ "$actual" != "$expected" ]; then
            echo "::error::refigure --version printed '$actual', expected '$expected' — check refigure/__init__.py's __version__ derivation against pyproject.toml"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Unit tests (tests/unit/) — hermetic: synthetic fixtures built in the test
  # itself, no real corpus, no network.
  #
  # Coverage data (.coverage.unit) is uploaded as an artifact for the
  # `coverage` job below, which combines it with test-integration's own data
  # and gates on the COMBINED total — unit-only alone is NOT gated
  # here, deliberately (see pyproject.toml's [tool.coverage.report] comment):
  # it understates real branch coverage on its own (a large share of
  # docx/xlsx's real-world branches only get exercised by the corpus-driven
  # integration tests), so gating this job alone would be noise, not signal.
  #
  # libreoffice-writer (stage 4b, 2026-08-05): installed here, not skipped,
  # so refigure/vlm.py's soffice-render path (test_vlm.py, tests/integration/
  # test_docx_groups_live.py) runs for real in CI — an untested CI path was
  # explicitly rejected for this feature. Cached via actions/cache (apt's
  # own .deb cache dir) so the ~10-20s
  # network download only happens once per cache-key generation, not every
  # run — dpkg unpack/configure still runs each time, apt-get itself decides
  # whether a cached .deb is still valid.
  # ---------------------------------------------------------------------------
  test-unit:
    name: Unit tests + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache libreoffice-writer apt packages
        uses: actions/cache@v6
        with:
          path: /var/cache/apt/archives
          key: apt-libreoffice-writer-${{ runner.os }}-v1

      - name: Install libreoffice-writer
        run: sudo apt-get update && sudo apt-get install -y libreoffice-writer

      - name: Install uv and set Python version
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"

      - name: Create venv and install dependencies
        run: |
          uv venv
          uv pip install -r requirements-dev.txt
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Pytest unit + coverage
        env:
          COVERAGE_FILE: .coverage.unit
        run: python -m pytest tests/unit --cov --cov-report=term-missing

      - name: Upload coverage data
        uses: actions/upload-artifact@v7
        with:
          name: coverage-data-unit
          path: .coverage.unit
          include-hidden-files: true

  # ---------------------------------------------------------------------------
  # Integration tests (tests/integration/) — real corpus fixtures (stage 5,
  # landed PR #7: 27 real documents, provenance/license in
  # tests/integration/fixtures/manifest.yaml). 26 of 27 are committed
  # directly (2026-08-05, ATTRIBUTION.md) and present in every CI checkout,
  # so this job now actually exercises the corpus — the exit-5 ("no tests
  # ran") tolerance below is kept only as a defensive fallback (e.g. a
  # future manifest-only addition with no fixture yet), not the expected
  # case anymore.
  # ---------------------------------------------------------------------------
  test-integration:
    name: Integration tests (CI-safe subset)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Same step as test-unit's (shares its apt cache key below) — found
      # missing here live during the 2026-08-19 pre-release audit:
      # tests/integration/test_docx_groups_live.py's own docstring claims
      # "CI installs libreoffice-writer... so this path is NOT expected to
      # skip there", but that install only ever existed in test-unit, a
      # separate job that never runs tests/integration/. Confirmed live via
      # this job's own past run logs: all 10
      # test_render_docx_group_produces_a_real_jpeg cases SKIPPED, every
      # run, silently — exactly the "untested CI path" this project's own
      # stated policy rejects.
      - name: Cache libreoffice-writer apt packages
        uses: actions/cache@v6
        with:
          path: /var/cache/apt/archives
          key: apt-libreoffice-writer-${{ runner.os }}-v1

      - name: Install libreoffice-writer
        run: sudo apt-get update && sudo apt-get install -y libreoffice-writer

      - name: Install uv and set Python version
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"

      - name: Create venv and install dependencies
        run: |
          uv venv
          uv pip install -r requirements-dev.txt
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Pytest integration (exit 5 = nothing collected yet, expected)
        env:
          COVERAGE_FILE: .coverage.integration
        run: |
          set +e
          python -m pytest tests/integration -v --cov --cov-report=term-missing
          code=$?
          if [ "$code" -eq 5 ]; then
            echo "0 integration tests yet (real corpus fixtures land in stage 5) — expected, not a failure."
            exit 0
          fi
          exit $code

      - name: Upload coverage data
        uses: actions/upload-artifact@v7
        with:
          name: coverage-data-integration
          path: .coverage.integration
          include-hidden-files: true
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Combined coverage gate: merges test-unit's and
  # test-integration's own coverage data (2 separate processes on 2 separate
  # runners — pytest-cov can't span that on its own) and gates on the
  # COMBINED total, 95%. Not 100% — some code is legitimately untestable in
  # CI (live-VLM/Bedrock/Vertex/Foundry network calls, already skipif'd)
  # without either faking tests or pragma-gaming the number past the point
  # of being an honest signal.
  # ---------------------------------------------------------------------------
  coverage:
    name: Combined coverage gate (95%)
    needs: [test-unit, test-integration]
    runs-on: ubuntu-latest
    # contents: write scoped to THIS job only, not the whole workflow file —
    # kept as a harmless fallback for the ambient GITHUB_TOKEN (used by
    # download-artifact); the badge-commit push itself now uses an explicit
    # PAT (below), not this token — see that step's comment for why.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # required_status_checks (2026-08-07) blocks a plain GITHUB_TOKEN
          # push to main unconditionally, not just during a race — the bot
          # actor has no admin bypass, so every attempt fails with GH006
          # regardless of retries. A fine-grained PAT scoped to
          # this repo, owned by an actual repo admin, gets the same
          # enforce_admins=false bypass a human push gets. Falls back to the
          # default GITHUB_TOKEN (read-only push, will fail the same way as
          # before) if the secret isn't set yet.
          token: ${{ secrets.COVERAGE_BADGE_PUSH_TOKEN || github.token }}

      - name: Install uv and set Python version
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"

      - name: Create venv and install coverage
        run: |
          uv venv
          uv pip install coverage
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Download coverage data
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-data-*
          merge-multiple: true

      - name: Combine + gate at 95%
        run: |
          coverage combine
          coverage report --fail-under=95 -m

      - name: Generate coverage badge JSON
        run: |
          coverage json -o coverage.json
          python scripts/gen_coverage_badge.py

      # Push-to-main only — not PRs, so feature branches don't churn this
      # file with a commit on every push. Pushes with the checkout
      # step's token (COVERAGE_BADGE_PUSH_TOKEN if set, see above) via
      # persist-credentials.
      - name: Commit updated badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        # Retries on a non-fast-forward push (found live 2026-08-06/07: a
        # burst of direct pushes to main outran this step's own push
        # several times in a row). Rebase-and-retry, not
        # force-push: this branch has allow_force_pushes=false.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/coverage-badge.json
          git diff --staged --quiet && exit 0
          git commit -m "chore: update coverage badge [skip ci]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected (attempt $i/5) — rebasing onto latest main and retrying"
            git fetch origin main
            git rebase origin/main
          done
          echo "::error::failed to push coverage badge after 5 attempts"
          exit 1

  # ---------------------------------------------------------------------------
  # Extras isolation matrix (stage 6): verifies the extras architecture's core
  # promise — previously only ASSERTED in CLAUDE.md/design docs, never
  # actually CI-checked. Each leg installs refigure into a FRESH, isolated
  # venv with exactly one extras combination (no shared requirements-dev.txt,
  # unlike the 3 jobs above, which install everything at once and so
  # couldn't catch an isolation break) — a leaked mammoth/openpyxl import
  # would only ever surface here, not in quality/test-unit/test-integration.
  # ---------------------------------------------------------------------------
  test-extras:
    name: Extras isolation (${{ matrix.extras }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # vlm/docx+vlm added stage 4b (2026-08-05): same import-order risk
        # class PR #8 found in xlsx.py — integrating VLM code into existing
        # modules (chart_render.py/docx_groups.py) needs the same check, not
        # just "we added a try/except so it must be isolated". No soffice
        # needed here — this job verifies IMPORT isolation, not the
        # soffice-render path itself (that's test-unit's real corpus tests).
        #
        # vlm-direct added for the OpenAIClient/AnthropicClient direct
        # VlmClient implementations — this exact leg is what caught
        # vlm-direct's own extras-isolation bug locally before it ever
        # reached CI (self-referential `refigure[vlm]` dependency, see
        # pyproject.toml's vlm-direct comment).
        #
        # mcp added stage 10 phase 1 (2026-08-21): no self-referential
        # coupling to docx/xlsx/vlm (unlike vlm-direct) — a single leg is
        # enough, no docx+mcp/both+mcp combinations needed. Verifies
        # build_server() registers 0 tools without docx/xlsx present, and
        # refigure-mcp --help/--version work.
        #
        # full added for the uvx-distribution work (2026-08-21): the [full]
        # meta-extra, and the one leg in this matrix where [mcp] and
        # [docx]/[xlsx] are BOTH present at once — every other leg deliberately
        # keeps them apart. Verifies build_server() registers all 3 tools
        # together, not just the 0-tools case the plain `mcp` leg covers.
        extras: [bare, docx, xlsx, both, vlm, docx+vlm, vlm-direct, mcp, full]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv and set Python version
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"

      - name: Create isolated venv, install ONLY refigure[${{ matrix.extras }}] + pytest
        run: |
          uv venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          case "${{ matrix.extras }}" in
            bare) uv pip install . ;;
            docx) uv pip install ".[docx]" ;;
            xlsx) uv pip install ".[xlsx]" ;;
            both) uv pip install ".[docx,xlsx]" ;;
            vlm) uv pip install ".[vlm]" ;;
            docx+vlm) uv pip install ".[docx,vlm]" ;;
            vlm-direct) uv pip install ".[vlm-direct]" ;;
            mcp) uv pip install ".[mcp]" ;;
            full) uv pip install ".[full]" ;;
          esac
          uv pip install pytest

      - name: Verify extras isolation
        env:
          REFIGURE_EXTRAS_UNDER_TEST: ${{ matrix.extras }}
        run: python -m pytest tests/extras -v

  # ---------------------------------------------------------------------------
  # Docker distribution (2026-08-21): build-only, no push — catches a broken
  # Dockerfile on every push/PR, before a release tag ever reaches it. The
  # actual publish (GHCR, tag-triggered) is publish.yml's docker-publish job,
  # gated on `needs: publish` there. No branch filters needed here either —
  # this file's own `on:` block already has none (feedback_ci_branch_triggers).
  # ---------------------------------------------------------------------------
  docker-build:
    name: Docker image (build + smoke test, ${{ matrix.platform }})
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        # linux/arm64 added 2026-08-22 (docs/distribution/docker-arm64 spec)
        # — a native GitHub-hosted arm64 runner (GA, free/unmetered for
        # public repos since Jan 2025), not QEMU: no emulation anywhere in
        # this pipeline. `docker build` below needs no --platform flag on
        # either leg — each runner builds natively for its own host arch.
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t refigure:ci .

      - name: Smoke test — both console scripts
        run: |
          docker run --rm refigure:ci refigure --version
          docker run --rm refigure:ci refigure-mcp --version

      - name: Smoke test — soffice binary is really there
        # Direct confirmation the VLM composite-figure path's one true
        # dependency is present, not an indirect inference from --version.
        run: docker run --rm --entrypoint soffice refigure:ci --version

      - name: Smoke test — real conversion via bind mount
        run: |
          mkdir -p /tmp/docker-smoke
          python3 scripts/docker_smoke_fixture.py /tmp/docker-smoke/doc.docx \
            "hello from the docker smoke test"
          out="$(docker run --rm -v /tmp/docker-smoke:/data:ro refigure:ci refigure /data/doc.docx)"
          echo "$out"
          echo "$out" | grep -q "hello from the docker smoke test"

      - name: Smoke test — HTTP transport reachable on a non-loopback bind
        # Verifies the exact README-documented pattern: --mcp-http-host
        # 0.0.0.0 is what makes -p published ports reachable at all (the
        # default 127.0.0.1 bind is NOT reachable through Docker's own port
        # publishing — NAT reaches the container's external interface, not
        # its loopback). 401 confirms both "reachable" (not connection
        # refused) and "auth enforced" (no bearer token sent).
        run: |
          printf 'sk-ci-smoke-token = ci\n' > /tmp/docker-smoke/tokens.txt
          docker run -d --rm --name refigure-http-smoke -p 18000:8000 \
            -v /tmp/docker-smoke/tokens.txt:/data/tokens.txt:ro \
            refigure:ci refigure-mcp --transport http --mcp-http-host 0.0.0.0 \
            --mcp-auth-token-file /data/tokens.txt

          code=""
          for _ in $(seq 1 10); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18000/mcp \
              -X POST -H 'Content-Type: application/json' \
              -H 'Accept: application/json, text/event-stream' -d '{}' || true)"
            [ "$code" = "401" ] && break
            sleep 1
          done
          docker logs refigure-http-smoke
          docker stop refigure-http-smoke
          echo "http_code=$code"
          [ "$code" = "401" ]

  # ---------------------------------------------------------------------------
  # .mcpb distribution (2026-08-22): build-verify on every push/PR — cheap
  # (packing is near-instant, no Docker-style slow build), so no reason not
  # to run it every time. Actual release-asset attachment (re-run every
  # release, not one-time — see the spec's own note on why) is
  # publish.yml's mcpb-publish job, gated on `needs: github-release`.
  # ---------------------------------------------------------------------------
  mcpb-build:
    name: MCPB bundle (validate + pack + uv smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"

      - name: Install mcpb CLI (pinned)
        run: npm install -g @anthropic-ai/mcpb@2.1.2

      - name: Validate manifest
        run: mcpb validate mcpb/manifest.json

      - name: Pack the bundle
        # Explicit output name — `mcpb pack <dir>` alone names the file
        # after the directory ("mcpb.mcpb"), not the manifest's own
        # "name" field. Caught live during spec research.
        run: mcpb pack mcpb/ refigure.mcpb

      - name: Smoke test — uv actually resolves and runs the shim
        # The exact chain a host application (e.g. Claude Desktop) runs
        # on first launch: resolve refigure[mcp,docx,xlsx] from PyPI per
        # mcpb/pyproject.toml's unpinned range, then execute the shim.
        run: |
          cd mcpb
          out="$(uv run src/server.py --version)"
          echo "$out"
          echo "$out" | grep -q "^refigure-mcp "

  # ---------------------------------------------------------------------------
  # Dependency review (2026-08-22): free for public repos, no GHAS license
  # needed. Complements, doesn't duplicate, the quality job's pip-audit —
  # pip-audit scans the WHOLE currently-installed tree on every run;
  # dependency-review-action scans only what a given PR's diff actually
  # ADDS or bumps, against both known vulnerabilities and license
  # compatibility, directly in the PR's checks (and its own "Files changed"
  # dependency-diff UI). PR-only by nature (needs a base to diff against) —
  # `github.event_name` guard so a plain push to main doesn't try to run
  # (and fail-open/no-op oddly) against a nonexistent base. Not added to
  # required_status_checks: it doesn't run on every event, and this repo's
  # branch-protection semantics for a conditionally-skipped required check
  # aren't worth the edge cases at this project's scale — still shows up
  # as a real, visible check on every PR either way.
  # ---------------------------------------------------------------------------
  dependency-review:
    name: Dependency review (new/changed deps only)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
