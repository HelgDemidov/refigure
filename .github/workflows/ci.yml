name: CI

# 3 independent parallel jobs (single-responsibility, clear failure
# attribution) — same shape as the source pipeline's own ci.yml, the closest
# analog to this repo's scale (single Python package, no DB/frontend).
# No branch filters, deliberately — an enumerated branch-prefix list (feat/**,
# fix/**, ...) silently skips anything outside it (ci/**, test/**, chore/**,
# a stacked PR whose base isn't main — this is exactly how PR #4 merged with
# zero live CI signal, see feedback_ci_branch_triggers memory). pull_request
# with no `branches:` filter already covers every base branch, including
# stacked-PR bases; push with no filter covers pre-PR pushes on any branch
# name. The redundant double-run (push + pull_request firing on the same
# commit once a PR is open) costs a few extra CI minutes, free on a public
# repo — a fair trade against silently skipping a branch again.
on:
  push:
  pull_request:

jobs:
  # ---------------------------------------------------------------------------
  # Static analysis: lint, types, dependency CVE audit. Doesn't run pytest —
  # the fastest, cheapest job.
  # ---------------------------------------------------------------------------
  quality:
    name: Code quality (ruff + mypy + pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv and set Python version
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"

      - name: Create venv and install dependencies
        run: |
          uv venv
          uv pip install -r requirements-dev.txt
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Ruff (lint)
        run: ruff check refigure tests

      - name: Ruff (format check)
        run: ruff format --check refigure tests

      - name: Mypy (strict)
        run: python -m mypy refigure

      - name: Audit Python dependencies
        run: |
          uv pip install pip-audit
          pip-audit -r requirements.txt -r requirements-dev.txt

      # Narrow role: secret-scanning only, not a second SCA (pip-audit
      # above already covers CVEs). Pinned by commit SHA, not tag — the
      # action itself was supply-chain-compromised 2026-03-19/20 (credential
      # theft from the runner, all tags 0.0.1-0.34.2), see
      # docs/security/security-hardening/security-hardening-2026-08-06.md §2.
      # SHA is v0.36.0's dereferenced commit (git ls-remote --tags), the
      # current stable release, verified live before pinning.
      - name: Trivy secret scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          scanners: secret
          exit-code: "1"

  # ---------------------------------------------------------------------------
  # Unit tests (tests/unit/) — hermetic: synthetic fixtures built in the test
  # itself, no real corpus, no network.
  #
  # Coverage data (.coverage.unit) is uploaded as an artifact for the
  # `coverage` job below, which combines it with test-integration's own data
  # and gates on the COMBINED total (docs/testing/coverage-hardening/
  # coverage-hardening-2026-08-06.md §1/§3) — unit-only alone is NOT gated
  # here, deliberately (see pyproject.toml's [tool.coverage.report] comment):
  # it understates real branch coverage on its own (a large share of
  # docx/xlsx's real-world branches only get exercised by the corpus-driven
  # integration tests), so gating this job alone would be noise, not signal.
  #
  # libreoffice-writer (stage 4b, 2026-08-05): installed here, not skipped,
  # so refigure/vlm.py's soffice-render path (test_vlm.py, tests/integration/
  # test_docx_groups_live.py) runs for real in CI — an untested CI path was
  # explicitly rejected for this feature (docs/vlm/vlm-layer-port/vlm-layer-port-2026-08-05.md
  # §3). Cached via actions/cache (apt's own .deb cache dir) so the ~10-20s
  # network download only happens once per cache-key generation, not every
  # run — dpkg unpack/configure still runs each time, apt-get itself decides
  # whether a cached .deb is still valid.
  # ---------------------------------------------------------------------------
  test-unit:
    name: Unit tests + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache libreoffice-writer apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-libreoffice-writer-${{ runner.os }}-v1

      - name: Install libreoffice-writer
        run: sudo apt-get update && sudo apt-get install -y libreoffice-writer

      - name: Install uv and set Python version
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"

      - name: Create venv and install dependencies
        run: |
          uv venv
          uv pip install -r requirements-dev.txt
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Pytest unit + coverage
        env:
          COVERAGE_FILE: .coverage.unit
        run: python -m pytest tests/unit --cov --cov-report=term-missing

      - name: Upload coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data-unit
          path: .coverage.unit
          include-hidden-files: true

  # ---------------------------------------------------------------------------
  # Integration tests (tests/integration/) — real corpus fixtures (stage 5,
  # landed PR #7: 27 real documents, provenance/license in
  # tests/integration/fixtures/manifest.yaml). 26 of 27 are committed
  # directly (2026-08-05, ATTRIBUTION.md) and present in every CI checkout,
  # so this job now actually exercises the corpus — the exit-5 ("no tests
  # ran") tolerance below is kept only as a defensive fallback (e.g. a
  # future manifest-only addition with no fixture yet), not the expected
  # case anymore.
  # ---------------------------------------------------------------------------
  test-integration:
    name: Integration tests (CI-safe subset)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv and set Python version
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"

      - name: Create venv and install dependencies
        run: |
          uv venv
          uv pip install -r requirements-dev.txt
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Pytest integration (exit 5 = nothing collected yet, expected)
        env:
          COVERAGE_FILE: .coverage.integration
        run: |
          set +e
          python -m pytest tests/integration -v --cov --cov-report=term-missing
          code=$?
          if [ "$code" -eq 5 ]; then
            echo "0 integration tests yet (real corpus fixtures land in stage 5) — expected, not a failure."
            exit 0
          fi
          exit $code

      - name: Upload coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data-integration
          path: .coverage.integration
          include-hidden-files: true
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Combined coverage gate (docs/testing/coverage-hardening/
  # coverage-hardening-2026-08-06.md §1/§3): merges test-unit's and
  # test-integration's own coverage data (2 separate processes on 2 separate
  # runners — pytest-cov can't span that on its own) and gates on the
  # COMBINED total, 95%. Not 100% — some code is legitimately untestable in
  # CI (live-VLM/Bedrock/Vertex/Foundry network calls, already skipif'd)
  # without either faking tests or pragma-gaming the number past the point
  # of being an honest signal.
  # ---------------------------------------------------------------------------
  coverage:
    name: Combined coverage gate (95%)
    needs: [test-unit, test-integration]
    runs-on: ubuntu-latest
    # contents: write scoped to THIS job only, not the whole workflow file —
    # only the badge-commit step (push-to-main only, below) needs it; same
    # blast-radius-minimization principle already applied to id-token:write
    # in the release-gate spec's publish.yml (docs/release/release-gate/
    # release-gate-2026-08-06.md §3).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Install uv and set Python version
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"

      - name: Create venv and install coverage
        run: |
          uv venv
          uv pip install coverage
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Download coverage data
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-data-*
          merge-multiple: true

      - name: Combine + gate at 95%
        run: |
          coverage combine
          coverage report --fail-under=95 -m

      - name: Generate coverage badge JSON
        run: |
          coverage json -o coverage.json
          python scripts/gen_coverage_badge.py

      # Push-to-main only — not PRs, so feature branches don't churn this
      # file with a commit on every push (docs/testing/coverage-hardening/
      # coverage-hardening-2026-08-06.md §4). Uses the ambient GITHUB_TOKEN
      # (via the checkout step's default persist-credentials), no stored
      # secret needed.
      - name: Commit updated badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/coverage-badge.json
          git diff --staged --quiet && exit 0
          git commit -m "chore: update coverage badge [skip ci]"
          git push

  # ---------------------------------------------------------------------------
  # Extras isolation matrix (stage 6): verifies the extras architecture's core
  # promise — previously only ASSERTED in CLAUDE.md/design docs, never
  # actually CI-checked. Each leg installs refigure into a FRESH, isolated
  # venv with exactly one extras combination (no shared requirements-dev.txt,
  # unlike the 3 jobs above, which install everything at once and so
  # couldn't catch an isolation break) — a leaked mammoth/openpyxl import
  # would only ever surface here, not in quality/test-unit/test-integration.
  # ---------------------------------------------------------------------------
  test-extras:
    name: Extras isolation (${{ matrix.extras }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # vlm/docx+vlm added stage 4b (2026-08-05): same import-order risk
        # class PR #8 found in xlsx.py — integrating VLM code into existing
        # modules (chart_render.py/docx_groups.py) needs the same check, not
        # just "we added a try/except so it must be isolated". No soffice
        # needed here — this job verifies IMPORT isolation, not the
        # soffice-render path itself (that's test-unit's real corpus tests).
        #
        # vlm-direct added for the OpenAIClient/AnthropicClient direct
        # VlmClient implementations (docs/vlm/vlm-direct-clients/
        # vlm-direct-clients-2026-08-06.md) — this exact leg is what caught
        # vlm-direct's own extras-isolation bug locally before it ever
        # reached CI (self-referential `refigure[vlm]` dependency, see
        # pyproject.toml's vlm-direct comment).
        extras: [bare, docx, xlsx, both, vlm, docx+vlm, vlm-direct]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv and set Python version
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"

      - name: Create isolated venv, install ONLY refigure[${{ matrix.extras }}] + pytest
        run: |
          uv venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          case "${{ matrix.extras }}" in
            bare) uv pip install . ;;
            docx) uv pip install ".[docx]" ;;
            xlsx) uv pip install ".[xlsx]" ;;
            both) uv pip install ".[docx,xlsx]" ;;
            vlm) uv pip install ".[vlm]" ;;
            docx+vlm) uv pip install ".[docx,vlm]" ;;
            vlm-direct) uv pip install ".[vlm-direct]" ;;
          esac
          uv pip install pytest

      - name: Verify extras isolation
        env:
          REFIGURE_EXTRAS_UNDER_TEST: ${{ matrix.extras }}
        run: python -m pytest tests/extras -v
